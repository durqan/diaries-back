name: Deploy Backend

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build and deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # Сборка бинарника
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o diary-server ./cmd/server/main.go
          
          # Копируем ключ
          echo "$KEY" > /tmp/key
          chmod 600 /tmp/key
          
          # Копируем бинарник и рестартуем в одной команде
          scp -o StrictHostKeyChecking=no -i /tmp/key diary-server root@${HOST}:/home/diaries/diaries-back/diary-server
          ssh -o StrictHostKeyChecking=no -i /tmp/key root@${HOST} 'chmod +x /home/diaries/diaries-back/diary-server && cd /home/diaries && docker compose restart backend'
          
          rm /tmp/key