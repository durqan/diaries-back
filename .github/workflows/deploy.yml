name: Deploy Backend

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Build and deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o diary-server ./cmd/server/main.go
          
          echo "$KEY" > /tmp/key
          chmod 600 /tmp/key
          
          ssh -o StrictHostKeyChecking=no -i /tmp/key root@${HOST} "
            cat > /home/diaries/diaries-back/diary-server
            chmod +x /home/diaries/diaries-back/diary-server
            cd /home/diaries
            docker compose restart backend
          " < diary-server
          
          rm /tmp/key